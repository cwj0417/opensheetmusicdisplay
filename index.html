<!doctype html><html lang=zh-CN><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=theme-color content=#f6f6f8><meta name=description content="cwj's piano score - a private sheet music reader."><title>cwj's piano score</title><style>:root{--ink:#1b1b22;--muted:#6f6f7a;--line:#e7e7ec;--surface:#ffffff;--surface-2:#f4f4f7;--accent:#4f46e5;--accent-2:#8b5cf6;--accent-soft:#eef0ff;--shadow-sm:0 1px 2px rgba(21,21,35,.07);--shadow-md:0 14px 34px -14px rgba(21,21,35,.28);--radius:12px}*,:after,:before{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body,html{min-height:100%}body{color:var(--ink);background:radial-gradient(1100px 560px at 8% -12%,#e9ecff 0%,rgba(233,236,255,0) 62%),radial-gradient(900px 520px at 108% -4%,#ffefe4 0%,rgba(255,239,228,0) 58%),#f6f6f8;min-width:320px;margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Helvetica Neue,Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}::selection{background:rgba(99,102,241,.22)}.hidden{display:none!important}.app-bar{z-index:50;-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);background:rgba(250,250,252,.82);border-bottom:1px solid rgba(20,20,35,.07);position:sticky;top:0}.app-bar-inner{align-items:center;gap:14px;max-width:1400px;margin:0 auto;padding:8px 20px;display:flex}.brand{-webkit-user-select:none;user-select:none;flex:none;align-items:center;gap:8px;display:flex}.brand-logo{color:#fff;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:10px;align-items:center;justify-items:center;width:34px;height:34px;font-size:19px;line-height:1;display:grid;box-shadow:0 7px 16px -7px rgba(99,102,241,.85)}.brand-name{letter-spacing:.02em;font-size:14px;font-weight:700}.toolbar{flex:1;align-items:center;gap:10px;min-width:0;display:flex}.select-field{flex:0 1 340px;align-items:center;min-width:200px;display:flex;position:relative}.select-field select{-webkit-appearance:none;appearance:none;color:var(--ink);text-overflow:ellipsis;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);width:100%;height:40px;padding:0 38px 0 14px;font:inherit;font-size:13px;transition:border-color.12s,box-shadow.12s;box-shadow:var(--shadow-sm)}.select-field select:hover{border-color:#d7d7e0}.select-field select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.select-field .chevron{color:var(--muted);pointer-events:none;display:flex;position:absolute;right:12px}.tool-group{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);flex:none;align-items:center;gap:2px;padding:3px;display:flex}.btn{-webkit-appearance:none;appearance:none;color:var(--ink);white-space:nowrap;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;font:inherit;font-size:13px;transition:background-color.12s,border-color.12s,box-shadow.12s,transform.06s;display:inline-flex}.btn:hover{background:#fbfbfd;border-color:#d9d9e2;box-shadow:var(--shadow-sm)}.btn:active{transform:translateY(1px)}.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.tool-group .btn{background:none;border-color:transparent;border-radius:9px;height:34px;padding:0 10px;box-shadow:none}.tool-group .btn:hover{background:var(--surface);border-color:transparent;box-shadow:var(--shadow-sm)}.tool-group .btn-icon{width:34px;padding:0}.btn svg{flex:none}.zoom-value{color:var(--muted);text-align:center;-webkit-user-select:none;user-select:none;min-width:48px;padding:0 2px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}.number-input{-webkit-appearance:none;appearance:none;color:var(--ink);text-align:center;background:none;border:none;border-radius:8px;width:54px;height:34px;padding:0 4px;font:inherit;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}.number-input::-webkit-inner-spin-button,.number-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.number-input:focus-visible{background:var(--surface);outline:2px solid var(--accent);outline-offset:1px}.btn-timer{color:#fff;background:linear-gradient(135deg,#5b5bf0,#4338ca);border-color:transparent;flex:none;box-shadow:0 8px 18px -9px rgba(79,70,229,.85)}.btn-timer:hover{background:linear-gradient(135deg,#6666f5,#4c42d8);border-color:transparent;box-shadow:0 10px 22px -9px rgba(79,70,229,.9)}.btn-timer.is-active{color:var(--accent);background:var(--accent-soft);box-shadow:none}.btn-timer.is-active:hover{background:#e4e7ff}.score-shell{background:var(--surface);border-radius:18px;max-width:1240px;margin:8px auto 130px;padding:26px 34px 40px;animation:sheet-in.35s both;overflow-x:auto;box-shadow:0 2px 6px rgba(21,21,35,.04),0 28px 64px -30px rgba(21,21,35,.24)}#scoreDiv{min-height:240px;transition:opacity.18s}body.is-loading #scoreDiv{opacity:.35}@keyframes sheet-in{0%{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.error-banner{z-index:70;color:#fff;white-space:pre-wrap;background:#b91c1c;border-radius:var(--radius);max-width:min(720px,92vw);padding:10px 18px;font-size:13px;position:fixed;top:74px;left:50%;transform:translate(-50%);box-shadow:var(--shadow-md)}.timing-dock{z-index:60;color:#fff;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);background:rgba(24,24,34,.9);border-radius:16px;align-items:center;gap:14px;padding:9px 14px 9px 9px;display:flex;position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%);box-shadow:0 20px 44px -14px rgba(10,10,20,.6)}.timing-primary{-webkit-appearance:none;appearance:none;color:#1b1b22;white-space:nowrap;cursor:pointer;background:#fff;border:none;border-radius:11px;height:36px;padding:0 16px;font:inherit;font-size:13px;font-weight:600;transition:background-color.12s,transform.06s}.timing-primary:hover{background:#ececf5}.timing-primary:active{transform:translateY(1px)}.timing-readout{align-items:baseline;gap:7px;display:flex}.timing-label{color:rgba(255,255,255,.55);letter-spacing:.08em;font-size:11px}.timing-clock{letter-spacing:.02em;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}.timing-divider{background:rgba(255,255,255,.16);width:1px;height:22px}.timing-readout--now .timing-clock{color:rgba(255,255,255,.8);font-size:14px;font-weight:500}@media (max-width:1080px){.brand-name{display:none}.select-field{flex-basis:260px}}@media (max-width:880px){.app-bar-inner{flex-wrap:wrap;gap:8px;padding:8px 12px}.toolbar{flex-wrap:wrap;gap:8px;width:100%}.select-field{order:-1;flex:1 1 100%;min-width:0}.score-shell{border-radius:14px;margin:8px 10px 128px;padding:16px 14px 28px}}@media (max-width:560px){.toolbar{gap:6px}.tool-group{padding:2px}.tool-group .btn{height:32px}}@media (prefers-reduced-motion:reduce){*,:after,:before{transition-duration:.01ms!important;animation-duration:.01ms!important}}</style><script defer src=demo.js></script></head><body><header class=app-bar id=divControls><div class=app-bar-inner><div class=brand aria-label="cwj's piano score"><span class=brand-logo aria-hidden=true>♫</span> <span class=brand-name>琴谱</span></div><div class=toolbar><div class=select-field><select id=selectSample aria-label=选择曲目></select> <span class=chevron aria-hidden=true><svg width=14 height=14 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2.2 stroke-linecap=round stroke-linejoin=round><polyline points="6 9 12 15 18 9"></polyline></svg></span></div><div class=tool-group role=group aria-label=指针控制><button type=button class=btn id=previous-cursor-btn title=上一小节（←）><svg width=15 height=15 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2.2 stroke-linecap=round stroke-linejoin=round aria-hidden=true><polyline points="15 18 9 12 15 6"></polyline></svg> <span class=btn-label>向前</span></button> <button type=button class=btn id=next-cursor-btn title=下一小节（→）><span class=btn-label>向后</span> <svg width=15 height=15 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2.2 stroke-linecap=round stroke-linejoin=round aria-hidden=true><polyline points="9 18 15 12 9 6"></polyline></svg></button> <button type=button class="btn btn-icon" id=show-cursor-btn title=显示指针 aria-label=显示指针><svg width=16 height=16 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round aria-hidden=true><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx=12 cy=12 r=3></circle></svg></button> <button type=button class="btn btn-icon" id=hide-cursor-btn title=隐藏指针 aria-label=隐藏指针><svg width=16 height=16 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round aria-hidden=true><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1=1 y1=1 x2=23 y2=23></line></svg></button></div><div class=tool-group id=zoomControls role=group aria-label=缩放><button type=button class="btn btn-icon" id=zoom-out-btn title=缩小 aria-label=缩小>−</button> <span class=zoom-value id=zoom-str>100%</span> <button type=button class="btn btn-icon" id=zoom-in-btn title=放大 aria-label=放大>+</button></div><div class=tool-group role=group aria-label=转调><input class=number-input type=number id=transpose value=0 step=1 aria-label=转调半音数> <button type=button class=btn id=transpose-btn title=按半音数转调>转调</button></div><button type=button class="btn btn-timer" id=show-timing><svg width=15 height=15 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round aria-hidden=true><circle cx=12 cy=13 r=8></circle><path d="M12 9v4l2.5 2.5"></path><path d="M9 2h6"></path></svg> 计时</button></div></div></header><main class=score-shell id=scoreShell aria-label=乐谱></main><div class=error-banner id=error-tr style=display:none><span id=error-td></span></div><div class=timing-dock id=timing style=display:none><button type=button class=timing-primary id=timing-operator>开始 / 重置</button><div class=timing-readout><span class=timing-label>已计时</span> <span class=timing-clock id=counting>00 : 00</span></div><span class=timing-divider aria-hidden=true></span><div class="timing-readout timing-readout--now"><span class=timing-label>现在</span> <span class=timing-clock id=now>00 : 00 : 00</span></div></div></body></html>
