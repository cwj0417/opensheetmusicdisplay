name: build-and-deploy
on:
  push:
    branches:
      - develop
jobs: 
  fetchandbuild:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: "22"
        - run: yarn install --ignore-scripts
        - run: yarn prebuildVexflow
        - run: yarn prod
        - uses: JamesIves/github-pages-deploy-action@v4
          with:
            branch: page
            folder: build
            