<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f6f8">
    <meta name="description" content="cwj's piano score - a private sheet music reader.">
    <title>cwj's piano score</title>
    <style>
        :root {
            --ink: #1b1b22;
            --muted: #6f6f7a;
            --line: #e7e7ec;
            --surface: #ffffff;
            --surface-2: #f4f4f7;
            --accent: #4f46e5;
            --accent-2: #8b5cf6;
            --accent-soft: #eef0ff;
            --shadow-sm: 0 1px 2px rgba(21, 21, 35, .07);
            --shadow-md: 0 14px 34px -14px rgba(21, 21, 35, .28);
            --radius: 12px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-width: 320px;
            overflow-x: hidden;
            color: var(--ink);
            background:
                radial-gradient(1100px 560px at 8% -12%, #e9ecff 0%, rgba(233, 236, 255, 0) 62%),
                radial-gradient(900px 520px at 108% -4%, #ffefe4 0%, rgba(255, 239, 228, 0) 58%),
                #f6f6f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
                "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            font-size: 14px;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::selection {
            background: rgba(99, 102, 241, .22);
        }

        .hidden {
            display: none !important;
        }

        /* ---------- Top bar ---------- */

        .app-bar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(250, 250, 252, .82);
            border-bottom: 1px solid rgba(20, 20, 35, .07);
            -webkit-backdrop-filter: blur(18px) saturate(1.5);
            backdrop-filter: blur(18px) saturate(1.5);
        }

        .app-bar-inner {
            display: flex;
            align-items: center;
            gap: 14px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 8px 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: none;
            user-select: none;
        }

        .brand-logo {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            color: #fff;
            font-size: 19px;
            line-height: 1;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            box-shadow: 0 7px 16px -7px rgba(99, 102, 241, .85);
        }

        .brand-name {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .02em;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        /* ---------- Select ---------- */

        .select-field {
            position: relative;
            display: flex;
            align-items: center;
            flex: 0 1 340px;
            min-width: 200px;
        }

        .select-field select {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 40px;
            padding: 0 38px 0 14px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--ink);
            font: inherit;
            font-size: 13px;
            text-overflow: ellipsis;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: border-color .12s ease, box-shadow .12s ease;
        }

        .select-field select:hover {
            border-color: #d7d7e0;
        }

        .select-field select:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .select-field .chevron {
            position: absolute;
            right: 12px;
            display: flex;
            color: var(--muted);
            pointer-events: none;
        }

        /* ---------- Buttons ---------- */

        .tool-group {
            display: flex;
            align-items: center;
            gap: 2px;
            flex: none;
            padding: 3px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--surface-2);
        }

        .btn {
            -webkit-appearance: none;
            appearance: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 38px;
            padding: 0 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--surface);
            color: var(--ink);
            font: inherit;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            transition: background-color .12s ease, border-color .12s ease, box-shadow .12s ease, transform .06s ease;
        }

        .btn:hover {
            background: #fbfbfd;
            border-color: #d9d9e2;
            box-shadow: var(--shadow-sm);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .btn:disabled {
            opacity: .45;
            cursor: not-allowed;
            transform: none;
        }

        .tool-group .btn {
            height: 34px;
            padding: 0 10px;
            border-color: transparent;
            border-radius: 9px;
            background: transparent;
            box-shadow: none;
        }

        .tool-group .btn:hover {
            background: var(--surface);
            border-color: transparent;
            box-shadow: var(--shadow-sm);
        }

        .tool-group .btn-icon {
            width: 34px;
            padding: 0;
        }

        .btn svg {
            flex: none;
        }

        .zoom-value {
            min-width: 48px;
            padding: 0 2px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            text-align: center;
            user-select: none;
        }

        .number-input {
            -webkit-appearance: none;
            appearance: none;
            width: 54px;
            height: 34px;
            padding: 0 4px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--ink);
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            text-align: center;
        }

        .number-input::-webkit-outer-spin-button,
        .number-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .number-input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
            background: var(--surface);
        }

        .btn-timer {
            flex: none;
            border-color: transparent;
            background: linear-gradient(135deg, #5b5bf0, #4338ca);
            color: #fff;
            box-shadow: 0 8px 18px -9px rgba(79, 70, 229, .85);
        }

        .btn-timer:hover {
            border-color: transparent;
            background: linear-gradient(135deg, #6666f5, #4c42d8);
            box-shadow: 0 10px 22px -9px rgba(79, 70, 229, .9);
        }

        .btn-timer.is-active {
            background: var(--accent-soft);
            color: var(--accent);
            box-shadow: none;
        }

        .btn-timer.is-active:hover {
            background: #e4e7ff;
        }

        /* ---------- Score sheet ---------- */

        .score-shell {
            max-width: 1240px;
            margin: 8px auto 130px;
            padding: 26px 34px 40px;
            border-radius: 18px;
            background: var(--surface);
            box-shadow: 0 2px 6px rgba(21, 21, 35, .04), 0 28px 64px -30px rgba(21, 21, 35, .24);
            overflow-x: auto;
            animation: sheet-in .35s ease both;
        }

        #scoreDiv {
            min-height: 240px;
            transition: opacity .18s ease;
        }

        body.is-loading #scoreDiv {
            opacity: .35;
        }

        @keyframes sheet-in {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        /* ---------- Error banner ---------- */

        .error-banner {
            position: fixed;
            top: 74px;
            left: 50%;
            z-index: 70;
            max-width: min(720px, 92vw);
            padding: 10px 18px;
            border-radius: var(--radius);
            background: #b91c1c;
            color: #fff;
            font-size: 13px;
            white-space: pre-wrap;
            box-shadow: var(--shadow-md);
            transform: translateX(-50%);
        }

        /* ---------- Timing dock ---------- */

        .timing-dock {
            position: fixed;
            left: 50%;
            bottom: calc(18px + env(safe-area-inset-bottom, 0px));
            z-index: 60;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 9px 14px 9px 9px;
            border-radius: 16px;
            background: rgba(24, 24, 34, .9);
            color: #fff;
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 44px -14px rgba(10, 10, 20, .6);
            transform: translateX(-50%);
        }

        .timing-primary {
            -webkit-appearance: none;
            appearance: none;
            height: 36px;
            padding: 0 16px;
            border: none;
            border-radius: 11px;
            background: #fff;
            color: #1b1b22;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: background-color .12s ease, transform .06s ease;
        }

        .timing-primary:hover {
            background: #ececf5;
        }

        .timing-primary:active {
            transform: translateY(1px);
        }

        .timing-readout {
            display: flex;
            align-items: baseline;
            gap: 7px;
        }

        .timing-label {
            color: rgba(255, 255, 255, .55);
            font-size: 11px;
            letter-spacing: .08em;
        }

        .timing-clock {
            font-size: 17px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            letter-spacing: .02em;
        }

        .timing-divider {
            width: 1px;
            height: 22px;
            background: rgba(255, 255, 255, .16);
        }

        .timing-readout--now .timing-clock {
            color: rgba(255, 255, 255, .8);
            font-size: 14px;
            font-weight: 500;
        }

        /* ---------- Responsive ---------- */

        @media (max-width: 1080px) {
            .brand-name {
                display: none;
            }

            .select-field {
                flex-basis: 260px;
            }
        }

        @media (max-width: 880px) {
            .app-bar-inner {
                flex-wrap: wrap;
                gap: 8px;
                padding: 8px 12px;
            }

            .toolbar {
                flex-wrap: wrap;
                gap: 8px;
                width: 100%;
            }

            .select-field {
                order: -1;
                flex: 1 1 100%;
                min-width: 0;
            }

            .score-shell {
                margin: 8px 10px 128px;
                padding: 16px 14px 28px;
                border-radius: 14px;
            }
        }

        @media (max-width: 560px) {
            .toolbar {
                gap: 6px;
            }

            .tool-group {
                padding: 2px;
            }

            .tool-group .btn {
                height: 32px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>
    <header class="app-bar" id="divControls">
        <div class="app-bar-inner">
            <div class="brand" aria-label="cwj's piano score">
                <span class="brand-logo" aria-hidden="true">&#9835;</span>
                <span class="brand-name">琴谱</span>
            </div>

            <div class="toolbar">
                <div class="select-field">
                    <select id="selectSample" aria-label="选择曲目"></select>
                    <span class="chevron" aria-hidden="true">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </span>
                </div>

                <div class="tool-group" role="group" aria-label="指针控制">
                    <button type="button" class="btn" id="previous-cursor-btn" title="上一小节（←）">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                        <span class="btn-label">向前</span>
                    </button>
                    <button type="button" class="btn" id="next-cursor-btn" title="下一小节（→）">
                        <span class="btn-label">向后</span>
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                    <button type="button" class="btn btn-icon" id="show-cursor-btn" title="显示指针"
                        aria-label="显示指针">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                    <button type="button" class="btn btn-icon" id="hide-cursor-btn" title="隐藏指针"
                        aria-label="隐藏指针">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>

                <div class="tool-group" id="zoomControls" role="group" aria-label="缩放">
                    <button type="button" class="btn btn-icon" id="zoom-out-btn" title="缩小"
                        aria-label="缩小">&#8722;</button>
                    <span class="zoom-value" id="zoom-str">100%</span>
                    <button type="button" class="btn btn-icon" id="zoom-in-btn" title="放大"
                        aria-label="放大">&#43;</button>
                </div>

                <div class="tool-group" role="group" aria-label="转调">
                    <input class="number-input" type="number" id="transpose" value="0" step="1"
                        aria-label="转调半音数" />
                    <button type="button" class="btn" id="transpose-btn" title="按半音数转调">转调</button>
                </div>

                <button type="button" class="btn btn-timer" id="show-timing">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="13" r="8"></circle>
                        <path d="M12 9v4l2.5 2.5"></path>
                        <path d="M9 2h6"></path>
                    </svg>
                    计时
                </button>
            </div>
        </div>
    </header>

    <main class="score-shell" id="scoreShell" aria-label="乐谱"></main>

    <div class="error-banner" id="error-tr" style="display: none">
        <span id="error-td"></span>
    </div>

    <div class="timing-dock" id="timing" style="display: none">
        <button type="button" class="timing-primary" id="timing-operator">开始 / 重置</button>
        <div class="timing-readout">
            <span class="timing-label">已计时</span>
            <span class="timing-clock" id="counting">00 : 00</span>
        </div>
        <span class="timing-divider" aria-hidden="true"></span>
        <div class="timing-readout timing-readout--now">
            <span class="timing-label">现在</span>
            <span class="timing-clock" id="now">00 : 00 : 00</span>
        </div>
    </div>
</body>

</html>
